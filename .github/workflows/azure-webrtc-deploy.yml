name: Deploy Azure WebRTC code
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment configured with the Azure OIDC identity
        required: true
        default: webrtc-test
        type: choice
        options:
          - webrtc-test
          - webrtc-prod
permissions:
  contents: read
concurrency:
  group: azure-webrtc-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r azure-functions/requirements-dev.txt
      - run: python -m ruff check azure-functions
      - run: python -m pytest -q
        working-directory: azure-functions
      - run: python scripts/validate_package.py
        working-directory: azure-functions
      - run: az bicep build --file azure-functions/infra/main.bicep --stdout > /dev/null
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: azure-functions
          remote-build: true
          respect-funcignore: true
